<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena da Tabuada 3D</title>
  <style>
    :root { --cyan:#00e5ff; --pink:#ff3f9d; --ink:#0b1020; }
    * { box-sizing:border-box; user-select:none; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#090d1a; font-family:Inter,Segoe UI,system-ui,sans-serif; }
    #game { position:fixed; inset:0; }
    #hud { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; justify-content:space-between; padding:22px; pointer-events:none; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
    .glass { color:#fff; background:rgba(10,16,35,.76); border:1px solid rgba(255,255,255,.16); box-shadow:0 14px 40px rgba(0,0,0,.3); backdrop-filter:blur(12px); border-radius:17px; }
    .stat { min-width:142px; padding:11px 22px 13px; text-align:center; }
    .label { display:block; color:#91a0bf; text-transform:uppercase; letter-spacing:2px; font-size:10px; font-weight:800; }
    .value { display:block; margin-top:2px; color:var(--cyan); font-size:30px; line-height:1; font-weight:900; text-shadow:0 0 15px rgba(0,229,255,.5); }
    #timer { color:#ff5dac; text-shadow:0 0 15px rgba(255,63,157,.5); }
    #question { align-self:center; margin-top:8px; padding:14px 28px; text-align:center; font-size:clamp(22px,3vw,38px); font-weight:900; color:#fff; letter-spacing:.5px; }
    #question small { display:block; margin-bottom:3px; color:#a8b5d0; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    #message { position:fixed; z-index:8; top:28%; left:50%; transform:translate(-50%,-50%) scale(.8); opacity:0; pointer-events:none; color:#fff; font-weight:900; font-size:clamp(24px,4vw,48px); text-shadow:0 4px 20px rgba(0,0,0,.6); transition:opacity .18s, transform .18s; }
    #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #message.good { color:#54ffd1; } #message.bad { color:#ff668f; }
    .bottom { display:flex; justify-content:space-between; align-items:end; gap:16px; }
    #phase-card { min-width:150px; }
    #phase-value { color:#ffd166; text-shadow:0 0 15px rgba(255,209,102,.45); }
    .life-card { min-width:210px; padding:11px 16px 13px; }
    .life-track { height:13px; margin-top:8px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.16); }
    #life-fill { height:100%; width:100%; border-radius:inherit; background:linear-gradient(90deg,#54ffd1,#ffd166,#ff668f); box-shadow:0 0 13px rgba(84,255,209,.55); transition:width .28s, background .28s; }
    #phase-tip { position:fixed; top:17%; left:50%; transform:translateX(-50%); z-index:7; color:#ffe49b; font-size:13px; font-weight:800; opacity:0; transition:opacity .3s; text-shadow:0 2px 10px #000; }
    #phase-tip.show { opacity:1; }
    @media(max-width:600px){ .life-card{min-width:145px}.life-card .label{font-size:9px} }
    .help { color:#d7e0f5; padding:13px 18px; font-size:12px; line-height:1.75; }
    kbd { display:inline-block; padding:1px 7px; border-radius:5px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.14); color:#fff; font:700 11px ui-monospace,monospace; }
    #loading { color:#aeefff; padding:11px 16px; font-size:12px; }
    #modal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(4,7,17,.84); backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .3s; }
    #modal.active { opacity:1; pointer-events:auto; }
    .panel { width:min(430px,90vw); padding:40px; color:#fff; text-align:center; border-radius:25px; background:linear-gradient(145deg,rgba(25,35,63,.98),rgba(12,17,34,.98)); border:1px solid rgba(255,255,255,.17); box-shadow:0 25px 80px rgba(0,0,0,.55); }
    .panel h1 { margin:0 0 8px; font-size:34px; background:linear-gradient(90deg,#00e5ff,#ff54a8); -webkit-background-clip:text; color:transparent; }
    .panel p { margin:10px 0 26px; color:#aeb9d0; } #final-score { display:block; margin-top:8px; color:#54ffd1; font-size:48px; font-weight:900; }
    button { border:0; border-radius:999px; padding:15px 28px; cursor:pointer; color:white; background:linear-gradient(100deg,#ff3f9d,#793cff); font-size:15px; font-weight:800; box-shadow:0 10px 26px rgba(255,63,157,.32); transition:transform .15s, filter .15s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.12); }
    @media(max-width:600px){ #hud{padding:12px}.stat{min-width:105px;padding:9px 12px}.value{font-size:25px}.help{font-size:10px;padding:9px 12px}.top{gap:8px} }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="top">
      <div class="glass stat"><span class="label">Pontuação</span><span id="score" class="value">0</span></div>
      <div id="phase-card" class="glass stat"><span class="label">Fase</span><span id="phase-value" class="value">1 / 5</span></div>
      <div class="glass stat"><span class="label">Tempo</span><span id="timer" class="value">60</span></div>
      <div class="glass life-card"><span class="label">Barra de vida · 10 erros</span><div class="life-track"><div id="life-fill"></div></div></div>
    </div>
    <div id="question" class="glass"><small>Encontre a resposta correta</small><span id="equation">? × ? = ?</span></div>
    <div class="bottom">
      <div class="glass help"><strong>Controles</strong><br><kbd>WASD</kbd> / <kbd>Setas</kbd> mover · <kbd>Shift</kbd> correr · <kbd>Espaço</kbd> pular</div>
      <div id="loading" class="glass">Carregando robô 3D...</div>
    </div>
  </div>
  <div id="message"></div>
  <div id="phase-tip">Você está indo muito bem!</div>
  <div id="modal"><div class="panel"><h1 id="modal-title">Tempo esgotado</h1><p id="modal-subtitle">Sua pontuação final:</p><span id="final-score">0</span><button id="again">Jogar Novamente</button></div></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, clock, player, mixer, currentAction;
    let fallback, audioContext, timerHandle, messageHandle;
    const actions = {}, keys = {}, blocks = [], particles = [];
    const arena = 28, duration = 60, playerHeight = 0;
    let score = 0, timeLeft = duration, active = true, jumping = false, jumpVelocity = 0;
    const totalPhases = 5, roundsPerPhase = 3, maxErrors = 10;
    let phase = 1, phaseCorrect = 0, errors = 0;
    let operation = { a: 2, b: 2, answer: 4 };
    const gardenTreePositions = [];
    const movement = new THREE.Vector3();
    const cameraGoal = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();

    const $ = id => document.getElementById(id);
    const colors = [0x19d3ff, 0xff4fa3, 0xffd166, 0x9b6cff, 0x48f59b, 0xff7b54];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1226);
      scene.fog = new THREE.FogExp2(0x0b1226, 0.018);
      camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 300);
      camera.position.set(0, 6, 11);
      renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      $('game').appendChild(renderer.domElement);
      clock = new THREE.Clock();
      setupLights();
      setupEnvironment();
      createFallback();
      loadCharacter();
      createRound();
      updateProgressUI();
      setupEvents();
      timerHandle = setInterval(() => { if (active) { timeLeft--; $('timer').textContent = timeLeft; if (timeLeft <= 0) endGame(); } }, 1000);
    }

    function setupLights() {
      scene.add(new THREE.HemisphereLight(0x9db7ff, 0x14162e, 2.2));
      const sun = new THREE.DirectionalLight(0xffffff, 3.2);
      sun.position.set(-12, 22, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
      sun.shadow.camera.left = -35; sun.shadow.camera.right = 35; sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
      scene.add(sun);
      const rim = new THREE.PointLight(0x00d9ff, 20, 35); rim.position.set(0, 6, -12); scene.add(rim);
    }

    function setupEnvironment() {
      scene.background = new THREE.Color(0x9bdcff);
      scene.fog = new THREE.Fog(0x9bdcff, 45, 105);
      const grass = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({ color:0x5dbb65, roughness:1, metalness:0 }));
      grass.rotation.x = -Math.PI/2; grass.receiveShadow = true; scene.add(grass);
      const path = new THREE.Mesh(new THREE.PlaneGeometry(8,58), new THREE.MeshStandardMaterial({ color:0xd6b77c, roughness:1 }));
      path.rotation.x = -Math.PI/2; path.position.y=.02; path.receiveShadow=true; scene.add(path);
      const pond = new THREE.Mesh(new THREE.CircleGeometry(7,32), new THREE.MeshStandardMaterial({ color:0x39bde8, emissive:0x064d72, emissiveIntensity:.25, roughness:.12, metalness:.25 }));
      pond.rotation.x=-Math.PI/2; pond.position.set(-15,.04,-11); pond.scale.set(1.3,.72,1); pond.receiveShadow=true; scene.add(pond);
      const pondRing = new THREE.Mesh(new THREE.RingGeometry(7,7.35,32), new THREE.MeshStandardMaterial({color:0xb7d77a,roughness:1}));
      pondRing.rotation.x=-Math.PI/2; pondRing.position.set(-15,.05,-11); pondRing.scale.set(1.3,.72,1); scene.add(pondRing);
      const fenceMat = new THREE.MeshStandardMaterial({ color:0xf4dfad, roughness:.8 });
      [[0,2,-arena],[0,2,arena],[-arena,2,0],[arena,2,0]].forEach(([x,y,z],i)=>{
        const fence = new THREE.Mesh(new THREE.BoxGeometry(i<2?arena*2:0.6,2.2,i<2?.55:arena*2), fenceMat); fence.position.set(x,y,z); fence.castShadow=true; fence.receiveShadow=true; scene.add(fence);
      });
      for(let i=0;i<55;i++) createGardenTree((Math.random()-.5)*58,(Math.random()-.5)*52);
      for(let i=0;i<70;i++) createGardenFlower((Math.random()-.5)*56,(Math.random()-.5)*52);
      for(let i=0;i<20;i++) { const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(.42,0),new THREE.MeshStandardMaterial({color:0x9a9b91,roughness:.9})); stone.position.set((Math.random()-.5)*54,.3,(Math.random()-.5)*52); stone.scale.y=.55; stone.castShadow=true; scene.add(stone); }
    }

    function createGardenTree(x,z) {
      if((Math.abs(x)<11 && Math.abs(z)<16) || (x<-7 && z<-3)) return;
      const tooClose = gardenTreePositions.some(tree => Math.hypot(tree.x-x, tree.z-z) < 10);
      if(tooClose) return;
      gardenTreePositions.push({x,z});
      const height=5.5+Math.random()*2.2, radius=2.6+Math.random()*1.1;
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.42,.7,height*.62,10),new THREE.MeshStandardMaterial({color:0x7b4b2a,roughness:1}));
      trunk.position.set(x,height*.31,z); trunk.castShadow=true; scene.add(trunk);
      const crown=new THREE.Mesh(new THREE.SphereGeometry(radius,16,12),new THREE.MeshStandardMaterial({color:[0x238344,0x2f9950,0x17733c][Math.floor(Math.random()*3)],roughness:.9}));
      crown.position.set(x,height*.72,z); crown.scale.y=1.08; crown.castShadow=true; scene.add(crown);
      const crown2=new THREE.Mesh(new THREE.SphereGeometry(radius*.7,14,10),new THREE.MeshStandardMaterial({color:0x42ad57,roughness:.9}));
      crown2.position.set(x-radius*.42,height*.83,z+radius*.2); crown2.castShadow=true; scene.add(crown2);
      const fruit=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6),new THREE.MeshStandardMaterial({color:[0xffcf4a,0xff6b5b,0xff8fb3][Math.floor(Math.random()*3)],emissive:0x6b3900,emissiveIntensity:.2}));
      fruit.position.set(x+radius*.45,height*.75,z+radius*.55); scene.add(fruit);
    }

    function createGardenFlower(x,z) {
      if(Math.hypot(x,z)<4) return;
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.45,5),new THREE.MeshStandardMaterial({color:0x287a3b}));
      stem.position.set(x,.23,z); scene.add(stem);
      const petal=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshStandardMaterial({color:[0xff6b9a,0xffd166,0xffffff,0xb993ff][Math.floor(Math.random()*4)],emissive:0x35152a,emissiveIntensity:.15}));
      petal.position.set(x,.53,z); petal.scale.y=.55; scene.add(petal);
    }

    function createFallback() {
      fallback = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(.52,1.1,6,12), new THREE.MeshStandardMaterial({color:0x4e78ff,emissive:0x142b8a,roughness:.35,metalness:.4})); body.position.y=1.1; body.castShadow=true; fallback.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.48,16,12), new THREE.MeshStandardMaterial({color:0xffc9a6,roughness:.55})); head.position.y=2.1; head.castShadow=true; fallback.add(head);
      const visor = new THREE.Mesh(new THREE.BoxGeometry(.6,.14,.08), new THREE.MeshBasicMaterial({color:0x00eaff})); visor.position.set(0,2.15,.43); fallback.add(visor);
      fallback.scale.setScalar(.78); scene.add(fallback); player=fallback;
    }

    function loadCharacter() {
      const loader = new GLTFLoader();
      loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', gltf => {
        const model = gltf.scene; model.scale.setScalar(.86); model.traverse(o => { if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
        if (fallback) scene.remove(fallback); player=model; player.position.set(0,0,0); scene.add(player);
        mixer = new THREE.AnimationMixer(player);
        gltf.animations.forEach(clip => { const action=mixer.clipAction(clip); actions[clip.name]=action; if(['Jump','Death'].includes(clip.name)){action.loop=THREE.LoopOnce;action.clampWhenFinished=true;} });
        fadeTo('Idle'); $('loading').textContent='Robô pronto'; setTimeout(()=>{$('loading').style.opacity='0'},1200);
      }, undefined, () => { $('loading').textContent='Modo offline: personagem alternativo'; $('loading').style.color='#ffd166'; });
    }

    function fadeTo(name, duration=.2) {
      if (!mixer || !actions[name] || currentAction === actions[name]) return;
      const next=actions[name]; if(currentAction) currentAction.fadeOut(duration); next.reset().setEffectiveWeight(1).fadeIn(duration).play(); currentAction=next;
    }

    function newOperation() {
      const max = Math.min(10, 4 + phase);
      operation.a = 2 + Math.floor(Math.random()*(max-1)); operation.b = 2 + Math.floor(Math.random()*(max-1)); operation.answer=operation.a*operation.b;
      $('equation').textContent = `${operation.a} × ${operation.b} = ?`;
    }

    function createRound() {
      blocks.forEach(b=>scene.remove(b.group)); blocks.length=0; newOperation();
      const values = new Set([operation.answer]);
      while(values.size<6){ values.add(Math.max(4, operation.answer + (Math.floor(Math.random()*17)-8))); }
      [...values].sort(()=>Math.random()-.5).forEach((value,i)=>createAnswerBlock(value,i));
    }

    function createAnswerBlock(value,index) {
      const group = new THREE.Group(); group.userData.value=value; group.userData.baseY=1.15; group.userData.phase=Math.random()*6;
      const material = new THREE.MeshStandardMaterial({color:colors[index%colors.length],emissive:colors[index%colors.length],emissiveIntensity:.55,roughness:.18,metalness:.55});
      const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(1.25,1), material); mesh.castShadow=true; mesh.receiveShadow=true; group.add(mesh);
      const label = makeText(value); label.position.set(0,0,1.08); label.rotation.y=Math.PI; group.add(label);
      const glow = new THREE.PointLight(colors[index%colors.length], 3.5, 6); glow.position.y=.2; group.add(glow);
      randomizeBlock(group, index); scene.add(group); blocks.push({group,value});
    }

    function makeText(text) {
      const canvas=document.createElement('canvas'); canvas.width=256; canvas.height=128; const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,256,128); ctx.font='900 82px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=12; ctx.strokeText(String(text),128,68); ctx.fillStyle='#fff'; ctx.fillText(String(text),128,68);
      const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas),transparent:true,depthTest:false})); sprite.scale.set(2.4,1.2,1); return sprite;
    }

    function randomizeBlock(group, index=0) {
      let x,z; do { x=(Math.random()-.5)*(arena*1.75); z=(Math.random()-.5)*(arena*1.75); } while(player && Math.hypot(x-player.position.x,z-player.position.z)<5);
      group.position.set(x,1.15,z); group.userData.phase=index*.8+Math.random()*3;
    }

    function setupEvents() {
      addEventListener('keydown', e=>{ keys[e.code]=true; initAudio(); if(e.code==='Space' && active && !jumping) jump(); if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); });
      addEventListener('keyup', e=>keys[e.code]=false); addEventListener('resize', resize); $('again').addEventListener('click', restart);
    }

    function jump() { jumping=true; jumpVelocity=10; if(actions.Jump) fadeTo('Jump',.08); }

    function updateMovement(dt) {
      if(!player || !active) return;
      movement.set((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),0,(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0));
      const moving=movement.lengthSq()>0, sprint=keys.ShiftLeft||keys.ShiftRight, speed=sprint?13:7;
      if(moving){movement.normalize(); player.position.addScaledVector(movement,speed*dt); const angle=Math.atan2(movement.x,movement.z),diff=THREE.MathUtils.euclideanModulo(angle-player.rotation.y+Math.PI,Math.PI*2)-Math.PI; player.rotation.y+=diff*Math.min(1,dt*12);}
      player.position.x=THREE.MathUtils.clamp(player.position.x,-arena+1,arena-1); player.position.z=THREE.MathUtils.clamp(player.position.z,-arena+1,arena-1);
      if(jumping){ player.position.y+=jumpVelocity*dt; jumpVelocity-=27*dt; if(player.position.y<=0){player.position.y=0;jumping=false;} }
      if(mixer && !jumping) fadeTo(moving?(sprint?'Running':'Walking'):'Idle',.18);
    }

    function updateBlocks(dt) {
      const now=clock.elapsedTime;
      blocks.forEach(({group})=>{ group.rotation.y+=dt*1.3; group.rotation.x=Math.sin(now*1.8+group.userData.phase)*.12; group.position.y=group.userData.baseY+Math.sin(now*2.3+group.userData.phase)*.18; if(player && active && player.position.distanceTo(group.position)<1.65) collect(group); });
    }

    function collect(group) {
      const correct=group.userData.value===operation.answer;
      playTone(correct);
      if(correct){
        score+=10; phaseCorrect++; createParticles(group.position,0x54ffd1);
        const encouragement = ['Muito bem! Você está aprendendo!', 'Excelente raciocínio!', 'Isso aí! Continue assim!', 'Você conseguiu! Que orgulho!', 'Resposta brilhante!'];
        showMessage('+10  ' + encouragement[Math.floor(Math.random()*encouragement.length)], true);
        if(phaseCorrect >= roundsPerPhase){
          if(phase < totalPhases){ phase++; phaseCorrect=0; showPhaseTip(`Fase ${phase}: novo desafio! Você consegue!`); }
          else { $('score').textContent=score; endGame('victory'); return; }
        }
        createRound();
      } else {
        score=Math.max(0,score-5); errors++; createParticles(group.position,0xff668f);
        const encouragement = ['Não desista: pense com calma!', 'Errar faz parte de aprender!', 'Você pode tentar novamente!', 'Respire e observe a operação!'];
        showMessage('-5  ' + encouragement[Math.floor(Math.random()*encouragement.length)], false);
        const item=blocks.find(b=>b.group===group); if(item) randomizeBlock(group);
        if(errors >= maxErrors){ $('score').textContent=score; updateProgressUI(); endGame('study'); return; }
      }
      $('score').textContent=score; updateProgressUI();
    }

    function updateProgressUI(){
      $('phase-value').textContent = `${phase} / ${totalPhases}`;
      $('life-fill').style.width = `${Math.max(0, 100 - errors * 10)}%`;
      $('life-fill').style.background = errors >= 7 ? 'linear-gradient(90deg,#ff9b66,#ff3f6e)' : 'linear-gradient(90deg,#54ffd1,#ffd166,#ff668f)';
    }

    function showPhaseTip(text){
      $('phase-tip').textContent=text; $('phase-tip').classList.add('show');
      setTimeout(()=>$('phase-tip').classList.remove('show'),1800);
    }

    function showMessage(text,good){ clearTimeout(messageHandle); $('message').textContent=text; $('message').className=`${good?'good':'bad'} show`; messageHandle=setTimeout(()=>{$('message').classList.remove('show')},850); }
    function createParticles(pos,color){ for(let i=0;i<22;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color})); p.position.copy(pos); scene.add(p); particles.push({mesh:p,life:.65,velocity:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8)});} }
    function updateParticles(dt){ for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.velocity.y-=14*dt;p.mesh.position.addScaledVector(p.velocity,dt);p.mesh.scale.multiplyScalar(.94);if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}} }
    function updateCamera(){ if(!player)return; cameraGoal.copy(player.position).add(new THREE.Vector3(0,5.3,9.5)); camera.position.lerp(cameraGoal,.075); lookTarget.copy(player.position); lookTarget.y+=1.15; camera.lookAt(lookTarget); }
    function initAudio(){ if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==='suspended')audioContext.resume(); }
    function playTone(correct){ if(!audioContext)return; const o=audioContext.createOscillator(),g=audioContext.createGain(); o.type='sine'; o.frequency.setValueAtTime(correct?620:180,audioContext.currentTime); o.frequency.exponentialRampToValueAtTime(correct?980:110,audioContext.currentTime+.16); g.gain.setValueAtTime(.16,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.19); }

    function endGame(reason='time'){
      if(!active)return; active=false; clearInterval(timerHandle);
      if(mixer) fadeTo(reason==='victory'?'Dance':'Death',.2);
      if(reason==='study'){
        $('modal-title').textContent='Você precisa estudar mais';
        $('modal-subtitle').textContent='Tudo bem! Cada tentativa ajuda você a aprender. Revise a tabuada e tente novamente!';
      } else if(reason==='victory'){
        $('modal-title').textContent='Parabéns! Você venceu as 5 fases!';
        $('modal-subtitle').textContent='Seu esforço e sua prática fizeram a diferença!';
      } else {
        $('modal-title').textContent='Tempo esgotado';
        $('modal-subtitle').textContent='Você foi muito bem! Treine mais um pouco e tente completar as 5 fases.';
      }
      $('final-score').textContent=score; $('modal').classList.add('active');
    }
    function restart(){ score=0;timeLeft=duration;active=true;jumping=false;phase=1;phaseCorrect=0;errors=0; $('score').textContent='0';$('timer').textContent=duration;$('modal').classList.remove('active'); if(player)player.position.set(0,0,0); updateProgressUI(); createRound(); clearInterval(timerHandle); timerHandle=setInterval(()=>{if(active){timeLeft--; $('timer').textContent=timeLeft;if(timeLeft<=0)endGame();}},1000); if(mixer)fadeTo('Idle',.1); }
    function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
    function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05); updateMovement(dt); updateBlocks(dt); updateParticles(dt); updateCamera(); if(mixer)mixer.update(dt); renderer.render(scene,camera); }
  </script>
</body>
</html>
